name: CICD-1

on:
    push:
    pull_request:

env:
    DOCKER_IMG : sarra006/day:latest
    
jobs:
    build_host_job:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            
            -   name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 24
            
            -   name: node version
                run : node --version
            
            -   name : npm version
                run : npm --version

            -   name: build
                run: npm install

            -   name : test
                run: npm test

            -   name: docker login
                uses : docker/login-action@v3
                with :
                    username : ${{secrets.DOCKERHUB_USERNAME}}
                    password : ${{secrets.DOCKERHUB_TOKEN}}
            -   name : docker img push
                run : docker push ${{DOCKER_IMG}}

    deploy-pannu:
        needs: build_host_job
        runs-on: ubuntu-latest
        steps:
            -   name: server shh
                uses : appleboy/ssh-action@v1
                with :
                    host : ${{vars.HOST_API}} 
                    username : ubuntu
                    key : ${{secrets.EC2_KEY}}
                    port : 22
                    scripts : |
                        docker rmi ${{env.DOCKER_IMG}}
                        docker pull ${{env.DOCKER_IMG}}
                        docker stop test-cont
                        docker run test-cont
                        docker run -d -p 80:3000 --name test-cont ${{env.DOCKER_IMG}}


