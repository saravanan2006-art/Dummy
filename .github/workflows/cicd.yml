name: CICD-1

on:
    push:
    pull_request:

jobs:
    build_host_job:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            
            -   name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 24
            
            -   name: node version
                run : node --version
            
            -   name : npm version
                run : npm --version

            -   name: build
                run: npm ci

            -   name : test
                run: npm test

            -   name: running
                run: npm run dev


